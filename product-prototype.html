<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政务AI · 文件助手（产品原型）</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

:root {
  --ink: #1B2430; --ink-2: #5B6472; --ink-3: #9AA1AD;
  --navy: #1B2A4A; --navy-2: #24324F;
  --red: #C0392B; --red-deep: #9B2C20; --red-soft: #FBEEE9;
  --amber: #C77B1E; --amber-soft: #FBF2E3;
  --green: #2F855A; --green-soft: #EAF3EE;
  --blue: #2E5FC0; --blue-soft: #EDF2FB;
  --purple: #7B5EA7; --purple-soft: #F0EDF8;
  --line: #E2E5EA;
  --serif: "Noto Serif SC", "SimSun", "Songti SC", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
  /* 三栏底色：淡绿 / 冷灰 / 暖米 */
  --sideL-bg: #E6EFE7;
  --sideL-ink: #1F4A33;
  --sideL-ink2: #5C7A68;
  --sideL-ink3: #8AA496;
  --sideL-active: #D4E6DA;
  --sideL-accent: #2E5E45;
  --main-bg: #EEF0F3;
  --sideR-bg: #F7F4EC;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); color: var(--ink); background: var(--main-bg); height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
.app { display: flex; height: 100vh; }

/* ===== 左栏（淡绿） ===== */
.sidebar-left { width: 252px; flex-shrink: 0; background: var(--sideL-bg); display: flex; flex-direction: column; overflow-y: auto; border-right: 1px solid #D3E0D6; }
.brand { padding: 20px 20px 16px; border-bottom: 1px solid #D3E0D6; }
.brand .logo { font-family: var(--serif); font-size: 18px; font-weight: 900; color: var(--sideL-ink); }
.brand .logo .accent { color: var(--sideL-accent); }
.brand .sub { font-size: 11px; color: var(--sideL-ink3); margin-top: 3px; letter-spacing: 1px; }
.new-btn { margin: 16px; background: var(--sideL-accent); color: #fff; border: none; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer; }
.new-btn:hover { background: #24503A; }
.side-group { padding: 4px 0 12px; }
.side-group .g-title { font-size: 10px; color: var(--sideL-ink3); letter-spacing: 2px; margin: 12px 20px 8px; }
.task-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; cursor: pointer; margin: 0 8px 2px; border-radius: 9px; position: relative; transition: background .15s; }
.task-item:hover { background: rgba(46,94,69,0.06); }
.task-item.active { background: var(--sideL-active); }
.task-item.active::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--sideL-accent); }
.task-item .t-ico { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
.task-item .t-info { flex: 1; min-width: 0; }
.task-item .t-title { font-size: 13px; color: var(--sideL-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-item .t-meta { font-size: 11px; color: var(--sideL-ink3); }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; margin: 0 8px 2px; border-radius: 9px; cursor: pointer; font-size: 13px; color: var(--sideL-ink2); position: relative; transition: background .15s; }
.nav-item:hover { background: rgba(46,94,69,0.06); }
.nav-item.active { background: var(--sideL-active); color: var(--sideL-ink); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--sideL-accent); }
.nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sideL-ink3); flex-shrink: 0; }
.nav-item .n-cnt { font-size: 11px; color: var(--sideL-ink3); margin-left: auto; }

/* ===== 中栏 ===== */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--main-bg); }
.main-head { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line); }
.main-head .task-title { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--navy); flex: 1; }
.main-head .share-btn { font-size: 13px; color: var(--blue); border: 1px solid var(--blue); border-radius: 8px; padding: 5px 14px; cursor: pointer; background: #fff; }
.main-body { flex: 1; overflow-y: auto; padding: 22px 26px; }

.msg { max-width: 88%; margin-bottom: 18px; }
.msg.user { margin-left: auto; }
.msg.user .bubble { background: var(--navy); color: #fff; border-radius: 14px 14px 4px 14px; padding: 12px 16px; font-size: 14px; }
.msg.user .m-meta { text-align: right; font-size: 11px; color: var(--ink-3); margin-top: 4px; }

.step { max-width: 88%; margin-bottom: 18px; animation: rise .4s ease both; }
.step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.step-head .step-no { font-family: var(--mono); font-size: 12px; font-weight: 700; color: #fff; background: var(--navy); border-radius: 6px; padding: 3px 10px; }
.step-head .step-name { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--navy); }
.step-head .step-status { font-size: 11px; color: var(--ink-3); }
.step-body { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }

.rec-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rec-badge { font-family: var(--serif); font-size: 14px; font-weight: 700; color: var(--red-deep); background: var(--red-soft); border: 1px solid rgba(192,57,43,0.25); padding: 5px 13px; border-radius: 8px; }
.conf { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; }
.conf.high { background: var(--green-soft); color: var(--green); }
.type-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.type-option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: all .15s; }
.type-option:hover { border-color: var(--navy); }
.type-option.active { border-color: var(--navy); background: #F7F9FC; }
.type-option .to-radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-3); flex-shrink: 0; margin-top: 2px; position: relative; }
.type-option.active .to-radio { border-color: var(--navy); }
.type-option.active .to-radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--navy); }
.type-option .to-name { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.type-option .to-output { font-size: 11px; color: var(--blue); white-space: nowrap; }
.type-option .to-explain { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.confirm-btn { margin-top: 14px; background: var(--navy); color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }

.expert-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; background: #FBFBFC; animation: rise .5s ease both; }
.expert-card .ec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.expert-card .ec-avatar { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0; }
.expert-card .ec-name { font-family: var(--serif); font-size: 14px; font-weight: 700; color: var(--ink); }
.expert-card .ec-role { font-size: 11px; color: var(--ink-3); }
.expert-card .ec-q { font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.expert-card .ec-q b { color: var(--navy); }
.expert-card .ec-refs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.ec-ref { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: #fff; }
.ec-ref .er-dot { width: 6px; height: 6px; border-radius: 50%; }
.expert-card .ec-judge { font-size: 13px; color: var(--ink); border-left: 3px solid var(--ec, var(--navy)); padding: 8px 12px; background: #fff; border-radius: 0 6px 6px 0; margin-bottom: 8px; }
.expert-card .ec-judge b { color: var(--navy); }
.expert-card .ec-output { font-size: 11px; color: var(--green); display: flex; align-items: center; gap: 5px; }
.expert-card .ec-output::before { content: '✓'; font-weight: 700; }
.done-banner { font-size: 13px; color: var(--green); background: var(--green-soft); border-radius: 8px; padding: 10px 14px; margin-top: 4px; }

.sandbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.param { margin-bottom: 16px; }
.param .label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.param .val { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--red); }
input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: #E2E5EA; outline: none; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--red); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(192,57,43,0.4); cursor: pointer; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.metric { background: #F8F9FB; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.metric .k { font-size: 11px; color: var(--ink-3); margin-bottom: 4px; }
.metric .v { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--navy); }
.metric .v small { font-size: 11px; color: var(--ink-3); }
.metric.hot { background: var(--red-soft); }
.metric.hot .v { color: var(--red-deep); }
.gap-bar { margin-bottom: 12px; }
.gap-bar .bl { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); margin-bottom: 6px; }
.gap-bar .track { height: 6px; background: #EBEDF1; border-radius: 3px; overflow: hidden; }
.gap-bar .fill { height: 100%; border-radius: 3px; transition: width .4s; }
.verdict { background: #FBFBFC; border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; }
.verdict .tag { display: inline-block; font-family: var(--serif); font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 4px; color: #fff; margin-bottom: 8px; }
.tag.high { background: var(--red); } .tag.mid { background: var(--amber); } .tag.low { background: var(--green); }
.verdict .v-title { font-family: var(--serif); font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
.verdict .v-desc { font-size: 12px; color: var(--ink-2); }
.chain { display: flex; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.chain-node { font-size: 11px; font-weight: 600; color: var(--red-deep); background: var(--red-soft); border: 1px solid rgba(192,57,43,0.3); padding: 3px 10px; border-radius: 5px; }
.chain-arrow { font-family: var(--mono); font-size: 13px; color: var(--red); padding: 0 6px; }

.doc-preview { background: #FBFBFC; border: 1px dashed var(--line); border-radius: 10px; padding: 16px 18px; }
.doc-preview .dp-title { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--ink); text-align: center; margin-bottom: 12px; }
.doc-preview .dp-sec { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.doc-preview .dp-sec .h { font-family: var(--serif); font-weight: 700; color: var(--ink); }
.doc-actions { display: flex; gap: 10px; margin-top: 14px; }
.doc-actions button { font-size: 13px; border-radius: 8px; padding: 8px 18px; cursor: pointer; }
.doc-download { background: var(--navy); color: #fff; border: none; }
.doc-copy { background: #fff; color: var(--blue); border: 1px solid var(--blue); }

.view-wrap { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 24px 26px; }
.view-title { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
.view-desc { font-size: 13px; color: var(--ink-3); margin-bottom: 20px; }
.kb-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.kb-tab { font-size: 13px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 16px; cursor: pointer; background: #fff; }
.kb-tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.kb-item { display: flex; gap: 14px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: #fff; }
.kb-item .ki-tag { flex-shrink: 0; margin-top: 2px; }
.kb-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 20px; }
.kb-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.kb-tag.policy { background: var(--red-soft); color: var(--red-deep); } .kb-tag.policy::before { background: var(--red); }
.kb-tag.report { background: var(--blue-soft); color: var(--blue); } .kb-tag.report::before { background: var(--blue); }
.kb-tag.paper { background: var(--purple-soft); color: var(--purple); } .kb-tag.paper::before { background: var(--purple); }
.kb-tag.internal { background: var(--green-soft); color: var(--green); } .kb-tag.internal::before { background: var(--green); }
.kb-item .ki-body { flex: 1; }
.kb-item .ki-title { font-size: 14px; font-weight: 600; color: var(--ink); }
.kb-item .ki-meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.kb-item .ki-excerpt { font-size: 12px; color: var(--ink-2); margin-top: 6px; line-height: 1.6; }

.agent-detail { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; background: #fff; position: relative; }
.agent-detail .ad-edit-btn { position: absolute; top: 16px; right: 16px; font-size: 12px; color: var(--blue); border: 1px solid var(--blue); border-radius: 7px; padding: 4px 14px; cursor: pointer; background: #fff; }
.agent-detail .ad-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.agent-detail .ad-avatar { width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 18px; font-weight: 700; color: #fff; }
.agent-detail .ad-name { font-family: var(--serif); font-size: 16px; font-weight: 700; color: var(--ink); }
.agent-detail .ad-role { font-size: 12px; color: var(--ink-3); }
.agent-detail .ad-method .am-label { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
.agent-detail .am-steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.agent-detail .am-step { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.agent-detail .am-step .am-num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ec, var(--navy)); width: 18px; flex-shrink: 0; }
.agent-detail .ad-field { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.agent-detail .ad-field b { color: var(--navy); }
.agent-detail .ad-edit-form .am-input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: var(--sans); color: var(--ink); margin-bottom: 6px; outline: none; }
.agent-detail .ad-edit-form .am-input:focus { border-color: var(--navy); }
.agent-detail .ad-edit-actions { display: flex; gap: 8px; margin-top: 10px; }
.agent-detail .ad-edit-actions button { font-size: 13px; border-radius: 7px; padding: 7px 18px; cursor: pointer; }
.ad-save { background: var(--navy); color: #fff; border: none; }
.ad-cancel { background: #fff; color: var(--ink-2); border: 1px solid var(--line); }

.output-item { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: #fff; }
.output-item .oi-ico { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0; }
.output-item .oi-body { flex: 1; }
.output-item .oi-title { font-size: 14px; font-weight: 600; color: var(--ink); }
.output-item .oi-meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.output-item .oi-status { font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 20px; }
.oi-status.done { background: var(--green-soft); color: var(--green); }
.oi-status.wait { background: var(--amber-soft); color: var(--amber); }

.followup { padding: 0 26px 14px; }
.followup .f-label { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
.followup .f-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.f-chip { font-size: 12px; color: var(--blue); border: 1px solid rgba(46,95,192,0.3); background: #fff; border-radius: 20px; padding: 6px 14px; cursor: pointer; }
.f-chip:hover { background: var(--blue); color: #fff; }
.input-bar { display: flex; gap: 10px; align-items: flex-end; padding: 14px 24px; background: #fff; border-top: 1px solid var(--line); }
.input-bar textarea { flex: 1; min-height: 44px; max-height: 120px; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-family: var(--sans); font-size: 14px; color: var(--ink); outline: none; }
.input-bar textarea:focus { border-color: var(--navy); }
.send-btn { flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px; background: var(--navy); color: #fff; border: none; font-size: 18px; cursor: pointer; }

/* 右栏 */
.sidebar-right { width: 332px; flex-shrink: 0; background: var(--sideR-bg); border-left: 1px solid #EAE4D6; display: flex; flex-direction: column; }
.ref-head { padding: 16px 20px 12px; border-bottom: 1px solid #EAE4D6; display: flex; align-items: center; justify-content: space-between; }
.ref-head .r-title { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--navy); }
.ref-head .r-count { font-size: 12px; color: var(--ink-3); }
.ref-filter { display: flex; gap: 6px; padding: 10px 20px; border-bottom: 1px solid #EAE4D6; flex-wrap: wrap; }
.f-btn { font-size: 11px; color: var(--ink-2); border: 1px solid #E0D9C8; border-radius: 20px; padding: 3px 11px; cursor: pointer; background: #fff; }
.f-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.ref-list { flex: 1; overflow-y: auto; padding: 14px 16px; }
.ref-card { background: #fff; border: 1px solid #EAE4D6; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; animation: rise .3s ease both; }
.ref-card .rc-top { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.ref-card .rc-num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--ink-3); }
.ref-card .rc-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 4px; }
.ref-card .rc-tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
.rc-tag.policy { background: var(--red-soft); color: var(--red-deep); } .rc-tag.policy::before { background: var(--red); }
.rc-tag.report { background: var(--blue-soft); color: var(--blue); } .rc-tag.report::before { background: var(--blue); }
.rc-tag.paper { background: var(--purple-soft); color: var(--purple); } .rc-tag.paper::before { background: var(--purple); }
.rc-tag.internal { background: var(--green-soft); color: var(--green); } .rc-tag.internal::before { background: var(--green); }
.ref-card .rc-org { font-size: 11px; color: var(--ink-3); }
.ref-card .rc-title { font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.55; margin-bottom: 4px; }
.ref-card .rc-meta { font-size: 11px; color: var(--ink-3); margin-bottom: 5px; }
.ref-card .rc-excerpt { font-size: 11px; color: var(--ink-2); line-height: 1.6; border-left: 2px solid #E5E0D3; padding-left: 8px; margin-bottom: 6px; }
.ref-card .rc-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--blue); }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 900px) { .sidebar-left { display: none; } .sidebar-right { display: none; } }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar-left">
    <div class="brand"><div class="logo">政务 AI<span class="accent"> · </span>文件助手</div><div class="sub">让决策有据可依</div></div>
    <button class="new-btn" id="newTaskBtn">+ 新建任务</button>
    <div class="side-group"><div class="g-title">我的任务</div><div id="taskList"></div></div>
    <div class="side-group">
      <div class="g-title">知识库</div>
      <div class="nav-item" data-view="knowledge" data-kb="policy"><span class="dot" style="background:#C0392B"></span>政策法规库<span class="n-cnt" id="cnt-policy">0</span></div>

function typeOf(id){ for (var i=0;i<TASK_TYPES.length;i++) if(TASK_TYPES[i].id===id) return TASK_TYPES[i]; return TASK_TYPES[0]; }
function recognize(text){
  var best=null, bs=0;
  for (var i=0;i<TASK_TYPES.length;i++){ var t=TASK_TYPES[i], s=0; for (var j=0;j<t.kw.length;j++) if(text.indexOf(t.kw[j])>=0) s++; if(s>bs){bs=s;best=t;} }
  if(!best) best=TASK_TYPES[0];
  return { type:best.id, confidence: bs>=2?94:(bs===1?86:55) };
}

var state = { currentTask:'t1', currentType:'special', filter:'all', view:'chat', kbTab:'all', editingAgent:null };

  { id:'t1', title:'老旧小区改造行动计划', type:'special', time:'08-17 22:30', icon:'改', color:'#C0392B', done:true },

];
function currentTask(){ return tasks.find(function(x){ return x.id===state.currentTask; }); }

function collectRefs(){
  var t = typeOf(state.currentType); var list=[], seen={};
  t.agents.forEach(function(aid){ var a=AGENTS[aid]; if(a&&a.refs) a.refs.forEach(function(r){ if(!seen[r.title]){ seen[r.title]=true; list.push(r); } }); });
  return list;
}
function allRefs(){
  var list=[], seen={};
  Object.keys(AGENTS).forEach(function(aid){ AGENTS[aid].refs.forEach(function(r){ if(!seen[r.title]){ seen[r.title]=true; list.push(r); } }); });
  return list;
}

function renderTaskList(){
  var el = document.getElementById('taskList'); el.innerHTML='';
  tasks.forEach(function(t){
    var div = document.createElement('div');
    div.className = 'task-item' + (state.currentTask===t.id && state.view==='chat' ? ' active' : '');
    div.innerHTML = '<div class="t-ico" style="background:'+t.color+'">'+t.icon+'</div>' +
      '<div class="t-info"><div class="t-title">'+t.title+'</div><div class="t-meta">'+typeOf(t.type).name+' · '+t.time+'</div></div>';
    div.onclick = function(){ state.currentTask=t.id; state.currentType=t.type; state.view='chat'; renderAll(); };
    el.appendChild(div);
  });
  var all = allRefs();
  document.getElementById('cnt-policy').textContent = all.filter(function(r){return r.type==='policy';}).length;
  document.getElementById('cnt-report').textContent = all.filter(function(r){return r.type==='report'||r.type==='paper';}).length;
  document.getElementById('cnt-internal').textContent = all.filter(function(r){return r.type==='internal';}).length;
  document.getElementById('cnt-outputs').textContent = tasks.filter(function(t){return t.done;}).length;
}

function renderNavActive(){

function renderMain(){

    '</div><div>' +
      '<div class="metrics">' +
        '<div class="metric"><div class="k">总投资</div><div class="v" id="r-cost">4.5<small> 亿</small></div></div>' +
        '<div class="metric hot"><div class="k">资金缺口</div><div class="v" id="r-gap">1.8<small> 亿</small></div></div>' +
        '<div class="metric"><div class="k">影响人口</div><div class="v" id="r-pop">2.8<small> 万户</small></div></div>' +
        '<div class="metric"><div class="k">覆盖需求率</div><div class="v" id="r-cover">64<small> %</small></div></div>' +
      '</div>' +
      '<div class="gap-bar"><div class="bl"><span>资金缺口率</span><b id="r-gaprate">40%</b></div><div class="track"><div class="fill" id="r-gapbar" style="width:40%;background:#C0392B;"></div></div></div>' +
      '<div class="verdict"><span class="tag high" id="r-tag">高风险</span><div class="v-title" id="r-title">建议分两期实施</div><div class="v-desc" id="r-desc">资金缺口 40%。</div><div class="chain" id="r-chain"></div></div>' +
    '</div></div>';
  shell.appendChild(body);
  setTimeout(runSandbox, 0);
  return shell;
}
function stepDoc(){
  var shell = stepShell('4', '输出参考稿', '草拟完成');
  var body = document.createElement('div'); body.className='step-body';
  var d = DRAFT[state.currentType];
  body.innerHTML = '<div class="doc-preview"><div class="dp-title">'+d.title+'</div>' +
    d.secs.map(function(s){ return '<div class="dp-sec"><span class="h">'+s+'</span></div>'; }).join('') +
    '</div><div style="font-size:11px;color:#9AA1AD;margin-top:10px;">AI 辅助草拟 · 供人工审定 · 非正式发文</div>' +
    '<div class="doc-actions"><button class="doc-download">下载 Word</button><button class="doc-copy">复制全文</button></div>';
  shell.appendChild(body);
  return shell;
}

var COST_PER=0.075, HOUSE_PER=470;
function fmt(x){ return Math.round(x*10)/10; }
function runSandbox(){
  var n=+document.getElementById('s-n').value, b=+document.getElementById('s-b').value, w=+document.getElementById('s-w').value, s=+document.getElementById('s-s').value;
  document.getElementById('v-n').textContent=n+' 个'; document.getElementById('v-b').textContent=b+' 亿'; document.getElementById('v-w').textContent=w+'%'; document.getElementById('v-s').textContent=s+'%';
  var totalCost=n*COST_PER, gap=Math.max(0,totalCost-b-totalCost*s/100), gapRate=gap/totalCost, pop=n*HOUSE_PER/10000, cover=Math.min(100,w*(1-gapRate*0.4)), ratePct=Math.round(gapRate*100);
  document.getElementById('r-cost').innerHTML=fmt(totalCost)+'<small> 亿</small>';
  document.getElementById('r-gap').innerHTML=fmt(gap)+'<small> 亿</small>';
  document.getElementById('r-pop').innerHTML=fmt(pop)+'<small> 万户</small>';
  document.getElementById('r-cover').innerHTML=Math.round(cover)+'<small> %</small>';
  document.getElementById('r-gaprate').textContent=ratePct+'%';
  var bar=document.getElementById('r-gapbar'); bar.style.width=Math.min(100,ratePct)+'%';
  var tag=document.getElementById('r-tag'), title=document.getElementById('r-title'), desc=document.getElementById('r-desc'), chain=document.getElementById('r-chain');
  var first=Math.max(1,Math.round(n*0.4)), second=n-first;
  if (gapRate>0.30){ bar.style.background='#C0392B'; tag.className='tag high'; tag.textContent='高风险'; title.textContent='建议分两期实施，优先改造 '+first+' 个成熟小区'; desc.textContent='资金缺口 '+ratePct+'%，第二期 '+second+' 个小区将资金断档。'; chain.innerHTML='<span class="chain-node">资金断档</span><span class="chain-arrow">→</span><span class="chain-node">项目停工</span><span class="chain-arrow">→</span><span class="chain-node">居民投诉</span><span class="chain-arrow">→</span><span class="chain-node">舆情发酵</span>'; }
  else if (gapRate>0.15){ bar.style.background='#C77B1E'; tag.className='tag mid'; tag.textContent='中等风险'; title.textContent='建议引入社会资本 + 以奖代补'; desc.textContent='缺口 '+fmt(gap)+' 亿元，可通过社会资本、专项债补齐。'; chain.innerHTML='<span class="chain-node">资金偏紧</span><span class="chain-arrow">→</span><span class="chain-node">部分进度放缓</span>'; }
  else { bar.style.background='#2F855A'; tag.className='tag low'; tag.textContent='低风险'; title.textContent='资金自洽，可按计划推进'; desc.textContent='目标、资金、民意自洽，具备上会条件。'; chain.innerHTML=''; }
}
document.addEventListener('input', function(e){ if(e.target && ['s-n','s-b','s-w','s-s'].indexOf(e.target.id)>=0) runSandbox(); });

function renderKnowledge(){
  var body = document.getElementById('mainBody');
  var all = allRefs();
  var html = '<div class="view-wrap"><div class="view-title">知识库</div><div class="view-desc">政策法规、文献报道、内部资料三类知识源，供专家智能体检索引用</div>';
  html += '<div class="kb-tabs">';
  var tabs = [ ['all','全部'], ['policy','政策法规'], ['report','文献报道'], ['internal','内部资料'] ];
  tabs.forEach(function(t){ html += '<span class="kb-tab'+(state.kbTab===t[0]?' active':'')+'" data-kb="'+t[0]+'">'+t[1]+'</span>'; });
  html += '</div>';
  var labelMap={policy:'政策',report:'报道',paper:'文献',internal:'内部'};
  var list = all.filter(function(r){
    if (state.kbTab==='all') return true;
    if (state.kbTab==='policy') return r.type==='policy';
    if (state.kbTab==='report') return r.type==='report'||r.type==='paper';
    if (state.kbTab==='internal') return r.type==='internal';
    return true;
  });
  list.forEach(function(r){
    html += '<div class="kb-item"><div class="ki-tag"><span class="kb-tag '+r.type+'">'+labelMap[r.type]+'</span></div>' +
      '<div class="ki-body"><div class="ki-title">'+r.title+'</div>' +
      '<div class="ki-meta">'+r.org+' · '+r.sub+' · '+r.date+'</div>' +
      '<div class="ki-excerpt">'+r.excerpt+'</div></div></div>';
  });
  html += '</div>';
  body.innerHTML = html;
  body.querySelectorAll('.kb-tab').forEach(function(tab){ tab.onclick = function(){ state.kbTab=tab.getAttribute('data-kb'); renderKnowledge(); renderNavActive(); }; });
}

function renderAgents(){
  var body = document.getElementById('mainBody');
  var html = '<div class="view-wrap"><div class="view-title">智能体</div><div class="view-desc">每位智能体有固定的思考方法，点击「编辑」可自定义其思考过程</div>';
  Object.keys(AGENTS).forEach(function(aid){ html += agentDetail(AGENTS[aid], aid); });
  html += agentDetail(CLERK, 'clerk');
  html += '</div>';
  body.innerHTML = html;
  bindAgentEdit(body);
}
function agentDetail(a, aid){
  var editing = state.editingAgent === aid;
  if (editing){
    var inputs = a.method.map(function(m){ return '<input class="am-input" value="'+m+'">'; }).join('');
    return '<div class="agent-detail" style="--ec:'+a.color+'" data-agent="'+aid+'">' +
      '<div class="ad-head"><div class="ad-avatar" style="background:'+a.color+'">'+a.icon+'</div>' +
      '<div><div class="ad-name">'+a.name+'</div><div class="ad-role">'+a.role+'</div></div></div>' +
      '<div class="ad-edit-form"><div class="am-label">编辑思考过程（每行一步）</div>'+inputs +
      '<div class="ad-edit-actions"><button class="ad-save">保存</button><button class="ad-cancel">取消</button></div></div></div>';
  }
  var stepsHtml = a.method.map(function(m, i){ return '<div class="am-step"><span class="am-num">'+(i+1)+'</span>'+m+'</div>'; }).join('');
  return '<div class="agent-detail" style="--ec:'+a.color+'" data-agent="'+aid+'">' +
    '<button class="ad-edit-btn">编辑</button>' +
    '<div class="ad-head"><div class="ad-avatar" style="background:'+a.color+'">'+a.icon+'</div>' +
    '<div><div class="ad-name">'+a.name+'</div><div class="ad-role">'+a.role+'</div></div></div>' +
    '<div class="ad-method"><div class="am-label">思考过程</div><div class="am-steps">'+stepsHtml+'</div></div>' +
    (a.refs ? '<div class="ad-field"><b>数据源</b>：'+a.refs.map(function(r){return r.org;}).join('、')+'</div>' : '') +
    '<div class="ad-field"><b>输出</b>：'+(a.refs?'研判意见':'参考稿（供人工审定）')+'</div></div>';
}
function bindAgentEdit(body){
  body.querySelectorAll('.ad-edit-btn').forEach(function(btn){
    btn.onclick = function(){ state.editingAgent = btn.closest('.agent-detail').getAttribute('data-agent'); renderAgents(); };
  });
  body.querySelectorAll('.ad-cancel').forEach(function(btn){ btn.onclick = function(){ state.editingAgent = null; renderAgents(); }; });
  body.querySelectorAll('.ad-save').forEach(function(btn){
    btn.onclick = function(){
      var aid = state.editingAgent;
      var card = btn.closest('.agent-detail');
      var vals = card.querySelectorAll('.am-input');
      var method = [];
      vals.forEach(function(inp){ if (inp.value.trim()) method.push(inp.value.trim()); });
      var target = aid==='clerk' ? CLERK : AGENTS[aid];
      if (target) target.method = method;
      state.editingAgent = null;
      renderAgents();
    };
  });
}

function renderOutputs(){
  var body = document.getElementById('mainBody');
  var html = '<div class="view-wrap"><div class="view-title">我的产出物</div><div class="view-desc">所有历史任务的参考稿存档，可预览、下载、重新编辑</div>';
  tasks.forEach(function(t){
    html += '<div class="output-item"><div class="oi-ico" style="background:'+t.color+'">'+t.icon+'</div>' +
      '<div class="oi-body"><div class="oi-title">'+DRAFT[t.type].title+'</div>' +
      '<div class="oi-meta">'+typeOf(t.type).name+' · '+t.time+'</div></div>' +
      '<span class="oi-status '+(t.done?'done':'wait')+'">'+(t.done?'已生成':'待生成')+'</span></div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

function renderRefs(){
  var refs = collectRefs();
  document.getElementById('refCount').textContent = refs.length+' 项';
  var el=document.getElementById('refList'); el.innerHTML='';
  var filtered = refs.filter(function(r){ return state.filter==='all'||r.type===state.filter; });
  var labelMap={policy:'政策',report:'报道',paper:'文献',internal:'内部'};
  filtered.forEach(function(r,i){
    var div=document.createElement('div');
    div.className='ref-card'; div.style.animationDelay=(i*0.05)+'s';
    div.innerHTML='<div class="rc-top"><span class="rc-num">['+(i+1)+']</span><span class="rc-tag '+r.type+'">'+labelMap[r.type]+'</span><span class="rc-org">'+r.org+'</span></div>' +
      '<div class="rc-title">'+r.title+'</div><div class="rc-meta">'+r.sub+' · '+r.date+'</div>' +
      '<div class="rc-excerpt">'+r.excerpt+'</div>' +
      '<div class="rc-foot"><span>查看原文</span><span>引用 →</span></div>';
    el.appendChild(div);
  });
}

function renderFollowup(){
  var f=FOLLOWUPS[state.currentType]||[];
  var el=document.getElementById('followup');
  if(state.view!=='chat'){ el.innerHTML=''; return; }
  var html='<div class="f-label">追问建议</div><div class="f-chips">';
  f.forEach(function(txt){ html+='<span class="f-chip">'+txt+'</span>'; });
  html+='</div>'; el.innerHTML=html;
  el.querySelectorAll('.f-chip').forEach(function(chip){ chip.onclick=function(){ document.getElementById('chatInput').value=chip.textContent; }; });
}

function send(){
  var input=document.getElementById('chatInput'); var text=input.value.trim();
  if(!text) return;
  input.value='';
  var conv=document.getElementById('mainBody');
  conv.appendChild(userMsg(text, '刚刚'));
  state.currentType = recognize(text).type;
  currentTask().type = state.currentType;
  currentTask().done = false;
  var shell = stepRecognize();
  conv.appendChild(shell);
  var body = shell.querySelector('.step-body');
  var btn = document.createElement('button'); btn.className='confirm-btn'; btn.textContent='确认，开始专家会诊';
  btn.onclick = function(){ btn.remove(); startExperts(); };
  body.appendChild(btn);
  conv.scrollTop=conv.scrollHeight;
  renderTaskList();
}
function newTask(){ state.view='chat'; document.getElementById('chatInput').value=''; document.getElementById('chatInput').focus(); renderAll(); }

document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('chatInput').addEventListener('keydown', function(e){ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); send(); } });
document.getElementById('newTaskBtn').addEventListener('click', newTask);
document.querySelectorAll('.nav-item').forEach(function(nav){
  nav.addEventListener('click', function(){
    state.view = nav.getAttribute('data-view');
    var kb = nav.getAttribute('data-kb');
    if (kb) state.kbTab = kb;
    else if (state.view==='knowledge') state.kbTab = 'all';
    renderAll();
  });
});
document.querySelectorAll('#refFilter .f-btn').forEach(function(btn){ btn.addEventListener('click', function(){ document.querySelectorAll('#refFilter .f-btn').forEach(function(b){ b.classList.remove('active'); }); btn.classList.add('active'); state.filter=btn.getAttribute('data-f'); renderRefs(); }); });

state.currentTask='t1';
renderAll();
</script>
